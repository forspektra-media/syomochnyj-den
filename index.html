<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

a{color:inherit}
svg{display:block}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#app{position:relative;height:100dvh;max-width:430px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
@media (min-width:520px){
  body{background:radial-gradient(circle at 20% 10%,#2b2f3a,#0e0f12)}

.top{flex:none;padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;display:flex;align-items:center;gap:10px}

.demo{flex:none;margin:0 16px 8px;padding:6px 12px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:700;text-align:center}

main{scrollbar-width:none;flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 24px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

.pcard{display:block;width:100%;text-align:left;position:relative;overflow:hidden}

.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.gray{background:var(--surface2);color:var(--muted)}

.chk .t{flex:1;font-weight:700;font-size:14.5px} .chk .k{font-size:11.5px;font-weight:800;color:var(--muted);background:var(--surface2);padding:3px 8px;border-radius:99px}

.bl{padding:12px 0;border-bottom:1px solid var(--line)} .bl:last-child{border-bottom:0}

.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.sum div{background:var(--surface2);border-radius:14px;padding:10px 12px}
.sum small{display:block;font-size:11.5px;font-weight:700;color:var(--muted)} .sum b{font-size:16px}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:50;animation:fade .2s}
.sheet{width:100%;background:var(--surface);border-radius:28px 28px 0 0;padding:12px 20px calc(env(safe-area-inset-bottom) + 22px);animation:up .25s;max-height:90%;overflow:auto}

.sheet .btn{margin-top:10px}
.bigcheck{width:84px;height:84px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:8px auto 16px}
.bigcheck .ico{width:44px;height:44px;stroke-width:2.6}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--surface2);border-top-color:var(--accent);margin:20px auto;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}} @keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(40px);opacity:0}}
.full{position:absolute;inset:0;background:#0f1a22;z-index:40;display:flex;flex-direction:column;animation:fade .2s}
.tg{flex:1;overflow:auto;padding:calc(env(safe-area-inset-top) + 12px) 14px 20px;background:linear-gradient(#17212b,#0e1621);color:#f5f5f5}
.tg .hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.tg .hd .back{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:rgba(255,255,255,.1);color:#fff}

.tg select{width:100%;margin-top:6px;min-height:44px;border-radius:10px;border:0;background:#243445;color:#fff;font:inherit;font-weight:700;padding:0 10px}
.msg{background:#233446;border-radius:6px 20px 20px 20px;padding:14px 16px;max-width:96%;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.msg h4{margin:0 0 8px;font-size:16px;font-weight:800}
.msg .ln{display:flex;gap:10px;margin:7px 0;font-size:14.5px;font-weight:600}
.msg .ln span:first-child{width:22px;flex:none;text-align:center}
.msg .mm{text-align:right;font-size:11.5px;color:#8ba0b3;margin-top:8px}
.tg .btn{margin-top:14px;min-height:60px;font-size:18px}
.tg .btn.done{background:#2f9e5f;color:#fff}
.tg .btn.sec{background:rgba(255,255,255,.12);color:#fff;min-height:48px;font-size:14px}

.set .row{padding:14px 0;border-bottom:1px solid var(--line)}
.hide-sb::-webkit-scrollbar{display:none}
.logo{width:40px;height:40px;border-radius:12px;background:var(--accent);display:grid;place-items:center;color:#fff;flex:none}

.chip.new{background:var(--accent-soft);color:var(--accent)}
.who{display:flex;align-items:center;gap:10px;width:100%;background:var(--surface);border-radius:16px;padding:8px 12px;box-shadow:var(--shadow);text-align:left;min-height:52px}
.who .wt{flex:1;min-width:0;display:flex;flex-direction:column}.who .wt b{font-size:14px;line-height:1.2}.who .wt small{font-size:12px;color:var(--muted);font-weight:700}

.ava.s{width:34px;height:34px;font-size:12px}.ava.img{object-fit:cover;background:var(--surface2)}

.menu{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;margin-bottom:10px;min-height:64px}

.tab{position:relative}

.ln2{font-size:13.5px;margin-top:6px;font-weight:600}.ln2 b{color:var(--accent)}

.lbl{display:block;font-weight:800;font-size:13.5px;margin:6px 0 6px}

function hlText(text){
  const stems=DICT.map(d=>d[0]),re=new RegExp('(?<![а-яё])('+stems.join('|')+')[а-яё]*','gi');

function suggest(p,s,text){

  const re=new RegExp('(?<![а-яё])('+DICT.map(d=>d[0]).join('|')+')[а-яё]*','gi');
  (text||'').toLowerCase().replace(re,(m,stem)=>{const d=DICT.find(x=>x[0]===stem.toLowerCase());if(d&&!seen[d[2]+d[1]]){seen[d[2]+d[1]]=1;if(!L[d[1]].includes(d[2]))out.push([d[1],d[2]])}return m});
  return out;
}

/* --- заявки на деньги и авансы --- */
function deptMoney(p,u){
  const rq=getReqs(),av=getAdv(),sum=a=>a.reduce((x,y)=>x+y,0);
  const approved=sum(rq.filter(q=>q.status==='approved'||q.status==='sent').map(q=>q.amt));
  const issuedReq=sum(rq.filter(q=>q.status==='sent').map(q=>q.amt)), issuedAdv=sum(av.map(a=>a.amt));
  const under=sum(av.filter(a=>a.status==='out').map(a=>a.amt))+sum(av.filter(a=>a.status==='reported'&&a.act==='перенёс').map(a=>a.left));
  const waitR=av.filter(a=>a.status==='out').length, wc=waitCount();
  return `<button class="card menu" data-act="tab" data-id="reqs"><span class="mi">${ico('coin')}</span><span class="n"><b>Заявки на деньги</b><small>${wc?wc+' '+plural(wc,'новая заявка','новые заявки','новых заявок')+' ждут решения':'все заявки решены'}</small></span>${wc?`<i class="dot n inl">${wc}</i>`:''}${ico('chev')}</button>
  <h2 style="margin-top:6px">Деньги цехам</h2><div class="card" style="padding:4px 16px">
   <div class="bl"><div class="top2"><span>Бюджет по цехам (план)</span><b class="money">${money(blOf(p).reduce((x,b)=>x+b.plan,0))}</b></div></div>
   <div class="bl"><div class="top2"><span>Одобрено заявок</span><b class="money">${money(approved)}</b></div></div>
   <div class="bl"><div class="top2"><span>Выдано по заявкам</span><b class="money">${money(issuedReq)}</b></div></div>
   <div class="bl"><div class="top2"><span>Выдано авансов под отчёт</span><b class="money">${money(issuedAdv)}</b></div></div>
   <div class="bl"><div class="top2"><span>Сейчас под отчётом</span><b class="money" style="color:var(--warn)">${money(under)}</b></div><div class="small">Ждём отчёт: ${waitR} ${plural(waitR,'цех','цеха','цехов')}</div></div></div>`;

function advCard(a,u,prod){

function tReqs(p,u){
  if(p.id!=='p1') return `<div class="card"><b>Заявки на деньги</b><p class="small" style="margin:6px 0 0">В примере заявки и авансы заполнены в проекте «Реклама банка — имиджевый ролик».</p></div>`;
  const prod=isProd(u), mgr=prod||u.kind==='accountant';
  const rq=getReqs().filter(q=>mgr||q.dept===u.dept), av=getAdv().filter(a=>mgr||a.dept===u.dept);
  const grp=(t,f)=>{const l=rq.filter(f);return l.length?`<h2>${t} · ${l.length}</h2>${l.map(q=>reqCard(q,u,prod)).join('')}`:''};
  return (mgr?(prod?`<button class="btn" data-act="newadv">${ico('plus')}Выдать аванс под отчёт</button>`:''):`<button class="btn" data-act="newreq">${ico('plus')}Новая заявка на деньги</button>`)+
   `<p class="hint" style="margin-top:12px">${mgr?'Цеха не ведут ежедневные расходы: большие траты идут заявкой, мелочи — авансом под отчёт.':'Крупную трату оформите заявкой: что нужно, сумма и к какому дню. Мелочи — из аванса, чеки сдаёте один раз в конце.'}</p>`+
   (rq.length?'':'<div class="card"><p class="small" style="margin:0">Заявок пока нет.</p></div>')+
   grp('Ждут решения',q=>q.status==='wait'||q.status==='clarify')+grp('Одобрено, ждут денег',q=>q.status==='approved')+grp('Деньги отправлены',q=>q.status==='sent')+grp('Отклонено',q=>q.status==='rejected')+
   (av.length?`<h2>Авансы под отчётом · ${av.length}</h2>${av.map(a=>advCard(a,u,prod)).join('')}`:'');

    <textarea id="rnote" class="inp ta" rows="3" placeholder="${k==='ask'?'Например: какие именно пледы и сколько?':'Например: уложитесь в аванс'}"></textarea><div class="msgerr" id="rerr"></div>
    <button class="btn" data-act="dornote">${k==='ask'?'Отправить вопрос':'Отклонить'}</button><button class="btn sec" data-act="closeSheet">Отмена</button></div></div>`}
  if(s==='rqsend') return `<div class="sheet-bg" data-act="closeSheet"><div class="sheet" data-stop><div class="grab"></div><h3>Деньги отправлены</h3><p>Выберите способ. Сумма сразу попадёт в бухгалтерию как выданная цеху.</p>
    <div class="chips2">${['перевод','наличные'].map(m=>`<button class="chip2 ${ui.method===m?'on':''}" data-act="method" data-id="${m}">${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}</div>
    <button class="btn" data-act="dorqsend">${ico('check')}Подтвердить</button><button class="btn sec" data-act="closeSheet">Отмена</button></div></div>`;
  if(s==='newadv') return `<div class="sheet-bg" data-act="closeSheet"><div class="sheet" data-stop><div class="grab"></div><h3>Аванс под отчёт</h3><p>Цех тратит на мелочи без записей и отчитывается один раз в конце.</p>
    <label class="lbl">Цех</label><select id="adept" class="inp">${depts(p).map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select>
    <label class="lbl">Лимит, сом</label><input id="aamt" class="inp" type="number" inputmode="numeric" placeholder="40000">
    <label class="lbl">На какой период</label><select id="aper" class="inp"><option>неделя 30 нояб. – 6 дек.</option><option>съёмочный блок 27–28 нояб.</option></select>
    <div class="msgerr" id="rerr"></div><button class="btn" data-act="doadv">${ico('send')}Выдать аванс</button><button class="btn sec" data-act="closeSheet">Отмена</button></div></div>`;
  if(s==='report'){return `<div class="sheet-bg" data-act="closeSheet"><div class="sheet" data-stop><div class="grab"></div><h3>Отчёт по авансу</h3><p>Один раз в конце периода: фото всех чеков пачкой и остаток.</p>
    <label class="lbl">Фото чеков</label><label class="filebtn">${ico('plus')}<span id="rcount">Выбрать фото (можно сразу много)</span><input id="rfiles" type="file" accept="image/*" multiple hidden></label>
    <label class="lbl">Остаток, сом</label><input id="rleft" class="inp" type="number" inputmode="numeric" placeholder="0">
    <label class="lbl">Что с остатком</label><div class="chips2">${['вернул','перенёс'].map(m=>`<button class="chip2 ${ui.ract===m?'on':''}" data-act="ract" data-id="${m}">${m==='вернул'?'Вернуть продюсеру':'Перенести на след. период'}</button>`).join('')}</div>
    <div class="msgerr" id="rerr"></div><button class="btn" data-act="doreport">${ico('send')}Отправить отчёт</button><button class="btn sec" data-act="closeSheet">Отмена</button></div></div>`}
  if(s==='settings') return `<div class="sheet-bg" data-act="closeSheet"><div class="sheet set" data-stop><div class="grab"></div><h3>Настройки</h3><p>Пример приложения «Съёмочный день». Все отметки хранятся только на этом телефоне.</p>
    <div class="row"><span style="font-weight:700">Версия</span><span class="small">прототип 0.2</span></div>
    <div class="row"><span style="font-weight:700">Данные</span><span class="small">вымышленные</span></div>
    <button class="btn line" style="margin-top:16px" data-act="reset">${ico('reset')}Сбросить пример</button><button class="btn sec" data-act="closeSheet">Закрыть</button></div></div>`;
  return '';
}

/* ---------- события ---------- */
function copyText(t){
  try{navigator.clipboard.writeText(t).catch(()=>fallbackCopy(t))}catch(e){fallbackCopy(t)}
}
function fallbackCopy(t){try{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}catch(e){}}
const LINKT={akter:'Ссылка на анкету актёра',gruppa:'Ссылка на анкету группы'};
$app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  if(el.tagName==='SELECT'||el.tagName==='OPTION') return;
  if(el.classList.contains('sheet-bg')&&e.target!==el) return;
  const a=el.dataset.act,id=el.dataset.id,p=ui.pid&&proj(),u=U();
  if(a==='login'){st.user=id;save();const x=U();ui.sheet=null;ui.dept=null;ui.scene=null;
    if(x.kind==='producer'){ui.view='projects';ui.pid=null}else{ui.view='project';ui.pid='p1';ui.tab=tabsFor(x)[0]}}
  else if(a==='logout'){st.user=null;save();ui.view='login';ui.pid=null;ui.dept=null;ui.scene=null}
  else if(a==='open'){ui.view='project';ui.pid=id;ui.tab='call';ui.dept=null;ui.scene=null}
  else if(a==='openarch'){ui.view='arch';ui.aid=id}
  else if(a==='unarch'){delete st.arch[id];save();ui.view='projects';ui.aid=null}
  else if(a==='archive'){st.arch[id]=1;save();ui.view='projects';ui.pid=null}
  else if(a==='home'){ui.view='projects';ui.pid=null;ui.aid=null}
  else if(a==='back'){const k=backKind(u);if(k==='dept')ui.dept=null;else if(k==='scene')ui.scene=null;else if(k==='more')ui.tab='more';else if(k==='money')ui.tab='money';else{ui.view='projects';ui.pid=null}}
  else if(a==='tab'){ui.tab=id;ui.dept=null;ui.scene=null}
  else if(a==='dept'){ui.dept=id}
  else if(a==='scene'){ui.tab='scenes';ui.scene=id}
  else if(a==='settings'){ui.sheet='settings'}
  else if(a==='closeSheet'){ui.sheet=null}
  else if(a==='reset'){st=ST0();try{localStorage.removeItem(KEY);localStorage.removeItem(FKEY)}catch(e){};FORMS=[];ui={view:'login',pid:null,tab:'call',sheet:null,asId:null,dept:null,scene:null,fid:null,link:null,copied:0,hl:{},aid:null,inv:null,method:'перевод',ract:'вернул',rq:null}}
  else if(a==='cast'){const cur=st.cast[id]??(p.cast.find(x=>x.id===id)?gCast(p.cast.find(x=>x.id===id)):3);st.cast[id]=cur===3?0:(cur+1)%3;st.seen[id]=1;save()}
  else if(a==='loc'){const l=p.locs.find(x=>x.id===id);st.loc[id]=gLoc(l)?0:1;save()}
  else if(a==='prop'){const i=propsFor(p).flatMap(s=>s.items).find(x=>x.id===id);st.prop[id]=gProp(i)?0:1;save()}
  else if(a==='dtask'){const d=dTasks(p,depts(p).find(x=>id.includes('-'+x.id+'-t'))).find(x=>x.id===id);st.dtask[id]=d.on?0:1;save()}
  else if(a==='gear'){const d=depts(p).find(x=>id.includes('-'+x.id+'-g'));const g=dGear(p,d).find(x=>x.id===id);st.gear[id]=GNEXT[g.s];save()}
   else if(a==='pay'){st.paid[id]=!st.paid[id];save()}
  else if(a==='obl'){st.obl[id]=!st.obl[id];save()}
  else if(a==='send'){ui.sheet='sending';render();setTimeout(()=>{ui.sheet='sent';st.sent[ui.pid]=1;save();render()},1100);return}
  else if(a==='part'||a==='part2'){ui.sheet=null;ui.view='part';ui.asId=(p.crew.find(x=>!gAcc(x))||p.crew[0]).id}
  else if(a==='partback'){ui.view='project'}
  else if(a==='accept'){st.acc[id]=1;save()}
  else if(a==='noaccept'){st.acc[id]=0;save()}
  else if(a==='link'){ui.link={k:id,t:id.startsWith('gruppa/')?'Ссылка на анкету цеха':(LINKT[id]||'Ссылка на анкету')};ui.copied=0;ui.sheet='link'}
  else if(a==='copy'){copyText(baseUrl()+'#'+ui.link.k);ui.copied=1;render();setTimeout(()=>{ui.copied=0;if(ui.sheet==='link')render()},2200);return}
  else if(a==='fopen'){ui.fid=id;ui.sheet='anketa';st.seen[id]=1;save()}
  else if(a==='hire'){const f=FORMS.find(x=>x.id===id);const role=formRole(f);
    st.team.push({id:'t'+f.id,name:f.name,dept:f.dept,role,hired:1,code:''});st.hired[id]=1;st.seen[id]=1;if(f.type==='akter')st.cast[id]=1;save();ui.inv={name:f.name,role,hired:1};ui.sheet='invited'}
  else if(a==='invite'){ui.sheet='invite'}
  else if(a==='doinvite'){const n=($app.querySelector('#iname').value||'').trim();
    if(n.split(/\s+/).length<2){$app.querySelector('#ierr').textContent='Напишите имя и фамилию';return}
    const role=$app.querySelector('#irole').value,dept=$app.querySelector('#idept').value,code=Math.random().toString(36).slice(2,8);
    st.team.push({id:'t'+Date.now().toString(36),name:n,dept,role,hired:0,code});save();ui.inv={name:n,role,code};ui.sheet='invited'}
  else if(a==='newreq'){ui.sheet='newreq'}
  else if(a==='doreq'){const w=($app.querySelector('#rwhat').value||'').trim(),m=Number($app.querySelector('#ramt').value),nd=$app.querySelector('#rneed').value,it=($app.querySelector('#ritems').value||'').split('\n').map(x=>x.trim()).filter(Boolean);
    const er=$app.querySelector('#rerr');if(w.length<4){er.textContent='Напишите, на что нужны деньги';return}if(!(m>=100)){er.textContent='Укажите сумму в сомах, например 45000';return}if(!nd){er.textContent='Выберите день';return}
    st.rqNew.push({id:'q'+Date.now().toString(36),dept:u.dept,by:u.name,what:w,amt:m,need:nd,items:it,status:'wait'});save();ui.sheet=null}
  else if(a==='rqok'){st.rq[id]=Object.assign(st.rq[id]||{},{status:'approved'});save()}
  else if(a==='rqnote'){ui.rq={id,k:el.dataset.k};ui.sheet='rqnote'}
  else if(a==='dornote'){const t=($app.querySelector('#rnote').value||'').trim();if(t.length<3){$app.querySelector('#rerr').textContent='Напишите пару слов';return}
    st.rq[ui.rq.id]=Object.assign(st.rq[ui.rq.id]||{},{status:ui.rq.k==='ask'?'clarify':'rejected',comment:t});save();ui.sheet=null}
  else if(a==='rqsend'){ui.rq={id};ui.method='перевод';ui.sheet='rqsend'}
  else if(a==='method'){ui.method=id;$app.querySelectorAll('[data-act=method]').forEach(b=>b.classList.toggle('on',b.dataset.id===id));return}
  else if(a==='dorqsend'){st.rq[ui.rq.id]=Object.assign(st.rq[ui.rq.id]||{},{status:'sent',method:ui.method});save();ui.sheet=null}
  else if(a==='newadv'){ui.sheet='newadv'}
  else if(a==='doadv'){const m=Number($app.querySelector('#aamt').value);if(!(m>=1000)){$app.querySelector('#rerr').textContent='Укажите лимит в сомах, например 40000';return}
    st.avNew.push({id:'v'+Date.now().toString(36),dept:$app.querySelector('#adept').value,amt:m,period:$app.querySelector('#aper').value,status:'out'});save();ui.sheet=null}
  else if(a==='report'){ui.rq={id};ui.ract='вернул';ui.sheet='report'}
  else if(a==='ract'){ui.ract=id;$app.querySelectorAll('[data-act=ract]').forEach(b=>b.classList.toggle('on',b.dataset.id===id));return}
  else if(a==='doreport'){const n=($app.querySelector('#rfiles').files||[]).length,l=$app.querySelector('#rleft').value,er=$app.querySelector('#rerr');
    if(!n){er.textContent='Добавьте фото чеков';return}if(l===''||Number(l)<0){er.textContent='Укажите остаток (0, если всё потрачено)';return}
    const av=getAdv().find(x=>x.id===ui.rq.id);const left=Number(l);if(left>av.amt){er.textContent='Остаток больше аванса';return}
    st.av[ui.rq.id]={status:'reported',spent:av.amt-left,left,act:ui.ract,photos:n};save();ui.sheet=null}
  else if(a==='hl'){const t=$app.querySelector('#sctext');if(t){st.sctext[id]=t.value;save()}ui.hl[id]=true}
  else if(a==='sadd'){const arr=st.sceneAdd[id]||(st.sceneAdd[id]=[]);arr.push([el.dataset.cat,el.dataset.item]);save()}
  render();
});
$app.addEventListener('change',e=>{ if(e.target.dataset.act==='who'){ui.asId=e.target.value;render()}
  if(e.target.id==='rfiles'){const n=e.target.files.length;const c=$app.querySelector('#rcount');if(c)c.textContent=n?'Выбрано фото: '+n:'Выбрать фото (можно сразу много)'} });
window.addEventListener('storage',()=>render());
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
window.addEventListener('focus',()=>render());
render();

</script>
</body>
