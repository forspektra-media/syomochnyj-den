function progress(p){
  const parts=[
    p.props.flatMap(s=>s.items).filter(gProp).length/Math.max(1,p.props.flatMap(s=>s.items).length),

}

function silhouette(name,i){
  const h=hue(name),w=i%3;
  const bg=`hsl(${h} 38% 78%)`, bg2=`hsl(${h} 34% 62%)`, fg=`hsl(${h} 30% 28%)`;
  const head=w===0?'<circle cx="100" cy="92" r="30"/>':w===1?'<ellipse cx="100" cy="92" rx="28" ry="32"/><path d="M68 90c0-26 14-40 32-40s32 14 32 40c-6-14-18-20-32-20s-26 6-32 20z"/>':'<circle cx="100" cy="94" r="29"/><path d="M70 96c-6-34 10-50 30-50s36 16 30 50c-4-12-4-26-30-26S74 84 70 96z"/>';
  return `<svg viewBox="0 0 200 210" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="g${i}${h}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${bg}"/><stop offset="1" stop-color="${bg2}"/></linearGradient></defs><rect width="200" height="210" fill="url(#g${i}${h})"/><g fill="${fg}" opacity=".85">${head}<path d="M30 215c0-48 30-70 70-70s70 22 70 70z"/></g></svg>`;
}

  if(type==='flat'||type==='office'){
    g=`<rect width="400" height="130" fill="${sky2}"/><rect x="40" y="18" width="130" height="80" rx="6" fill="${sky}" stroke="${d}" stroke-width="4"/><path d="M105 18v80M40 58h130" stroke="${d}" stroke-width="3"/><rect x="0" y="100" width="400" height="30" fill="${d2}"/><rect x="220" y="62" width="120" height="38" rx="8" fill="${d}"/><rect x="230" y="40" width="100" height="26" rx="8" fill="${d2}"/><circle cx="360" cy="40" r="10" fill="${sky}"/>`;
  }else if(type==='street'){
    g=`<rect width="400" height="130" fill="${sky2}"/><rect x="20" y="30" width="90" height="100" fill="${d2}"/><rect x="120" y="14" width="110" height="116" fill="${d}"/><rect x="240" y="40" width="80" height="90" fill="${d2}"/><rect x="330" y="24" width="70" height="106" fill="${d}"/>${[0,1,2,3].map(r=>[0,1,2].map(c=>`<rect x="${132+c*32}" y="${28+r*24}" width="18" height="14" fill="${sky2}"/>`).join('')).join('')}${[0,1,2].map(r=>[0,1].map(c=>`<rect x="${32+c*34}" y="${44+r*28}" width="16" height="16" fill="${sky2}"/>`).join('')).join('')}<rect x="0" y="112" width="400" height="18" fill="${d}" opacity=".7"/>`;
  }else if(type==='park'){
    g=`<rect width="400" height="130" fill="${sky2}"/><circle cx="330" cy="34" r="18" fill="${sky}"/><path d="M0 100q80-40 160-10t160-20 80 10v50H0z" fill="${d2}"/>${[60,150,250,340].map((x,i)=>`<rect x="${x-3}" y="${72+i%2*6}" width="6" height="40" fill="${d}"/><circle cx="${x}" cy="${64+i%2*6}" r="${20-i%2*3}" fill="${d}"/>`).join('')}<rect x="0" y="116" width="400" height="14" fill="${d}" opacity=".55"/>`;
  }else{
    g=`<rect width="400" height="130" fill="${sky2}"/><path d="M0 110L90 40l50 50 60-70 90 90 40-30 70 50v10H0z" fill="${d2}"/><path d="M90 40l-18 18 14 6 12-8 12 10zM200 20l-26 30 16 8 14-12 18 14z" fill="#fff" opacity=".9"/><path d="M0 120q100-18 200-6t200-4v20H0z" fill="${d}"/>`;
  }
  return `<svg viewBox="0 0 400 130" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${g}</svg>`;
}

    <div class="bar ${fact>p.budget?'bad':''}"><i style="width:${pct}%"></i></div>
    <div class="sum"><div><small>Бюджет</small><b class="money">${money(p.budget)}</b></div><div><small>Остаток</small><b class="money" style="color:var(--ok)">${money(p.budget-fact)}</b></div></div></div>
    <h2 style="margin-top:6px">Статьи расходов</h2><div class="card" style="padding:4px 16px">${p.bl.map(b=>{const over=b.fact>b.plan,w=b.plan?Math.min(100,b.fact/b.plan*100):0;
      return `<div class="bl"><div class="top2"><span>${esc(b.name)}</span>${over?`<span class="chip bad">+${money(b.fact-b.plan)}</span>`:''}</div><div class="bar ${over?'bad':''}"><i style="width:${w}%"></i></div>
      <div class="nums"><span>план <b class="money" style="color:var(--ink)">${money(b.plan)}</b></span><span>факт <b class="money" style="color:var(--ink)">${money(b.fact)}</b></span></div></div>`}).join('')}</div>
    <div class="card"><div class="row"><b>Итого по плану</b><b class="money">${money(plan)}</b></div><div class="row" style="margin-top:8px"><b>Итого по факту</b><b class="money">${money(fact)}</b></div></div>`;
}

function viewPart(){
  const p=proj(); const m=p.crew.find(x=>x.id===ui.asId)||p.crew.find(x=>!gAcc(x))||p.crew[0];
  const loc=p.locs.find(l=>l.id===p.locId), a=gAcc(m);
  return `<div class="full"><div class="tg"><div class="hd"><button class="back" data-act="partback" aria-label="Назад">${ico('back')}</button><div><b>Съёмочный день · бот</b><span>вид участника, Telegram</span></div></div>
    <div class="asview">Смотрим глазами участника:<select data-act="who">${p.crew.map(x=>`<option value="${x.id}" ${x.id===m.id?'selected':''}>${esc(x.name)} — ${esc(x.role)}</option>`).join('')}</select></div>
    <div class="msg"><h4>Вызывной: ${dfmt(p.date,{weekday:'long',day:'numeric',month:'long'})}</h4>
      <div class="ln"><span>🎬</span><span>${esc(p.title)}</span></div>
      <div class="ln"><span>👤</span><span>${esc(m.name)}, ${esc(m.role.toLowerCase())}</span></div>
      <div class="ln"><span>⏰</span><span>Сбор в <b>${p.call}</b>, конец смены около ${p.end}</span></div>
      <div class="ln"><span>📍</span><span>${esc(loc.name)}<br>${esc(loc.addr)}, Бишкек<br><a class="maplink" href="${mapUrl(loc.addr)}" target="_blank" rel="noopener">Открыть в 2ГИС</a></span></div>
      <div class="ln"><span>🌤</span><span>${esc(p.weather.replace('Пример: ',''))}</span></div>
      <div class="ln"><span>👕</span><span>Одежда по погоде, паспорт, питьевая вода. Питание на площадке.</span></div>
      <div class="mm">08:14</div></div>
    ${a?`<button class="btn done" data-act="noaccept" data-id="${m.id}">${ico('check')}Вы приняли вызывной</button><p style="text-align:center;color:#8ba0b3;font-weight:600;font-size:13px;margin:10px 0 0">Спасибо! Продюсер видит, что вы на связи. Нажмите ещё раз, чтобы отменить (для примера).</p>`
      :`<button class="btn" data-act="accept" data-id="${m.id}">Принял</button><p style="text-align:center;color:#8ba0b3;font-weight:600;font-size:13px;margin:10px 0 0">Нажмите «Принял», чтобы продюсер увидел подтверждение.</p>`}
    </div></div>`;
}

function viewSheet(){
  const s=ui.sheet;
  if(s==='sending') return `<div class="sheet-bg"><div class="sheet"><div class="grab"></div><h3 style="text-align:center">Отправляем…</h3><div class="spin"></div></div></div>`;
  if(s==='sent'){const p=proj();return `<div class="sheet-bg" data-act="closeSheet"><div class="sheet" data-stop><div class="grab"></div><div class="bigcheck">${ico('check')}</div>
    <h3 style="text-align:center">Отправлено ${p.crew.length} участникам</h3><p style="text-align:center">Вызывной ушёл в Telegram. Это пример: реальной отправки нет, никто ничего не получил.</p>
    <button class="btn" data-act="part2">${ico('eye')}Показать, что получит участник</button><button class="btn sec" data-act="closeSheet">Закрыть</button></div></div>`}
  if(s==='settings') return `<div class="sheet-bg" data-act="closeSheet"><div class="sheet set" data-stop><div class="grab"></div><h3>Настройки</h3><p>Пример приложения «Съёмочный день». Все отметки хранятся только на этом телефоне.</p>
    <div class="row"><span style="font-weight:700">Версия</span><span class="small">прототип 0.1</span></div>
    <div class="row"><span style="font-weight:700">Данные</span><span class="small">вымышленные</span></div>
    <button class="btn line" style="margin-top:16px" data-act="reset">${ico('reset')}Сбросить пример</button><button class="btn sec" data-act="closeSheet">Закрыть</button></div></div>`;
  return '';
}

/* ---------- события ---------- */
$app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  if(el.tagName==='SELECT'||el.tagName==='OPTION') return;
  if(el.classList.contains('sheet-bg')&&e.target!==el) return;
  const a=el.dataset.act,id=el.dataset.id,p=ui.pid&&proj();
  if(a==='open'){ui.view='project';ui.pid=id;ui.tab='call'}
  else if(a==='home'){ui.view='projects';ui.pid=null}
  else if(a==='tab'){ui.tab=id}
  else if(a==='settings'){ui.sheet='settings'}
  else if(a==='closeSheet'){ui.sheet=null}
  else if(a==='reset'){st={cast:{},loc:{},prop:{},acc:{},sent:{}};try{localStorage.removeItem(KEY)}catch(e){};ui.sheet=null}
  else if(a==='cast'){const c=p.cast.find(x=>x.id===id);st.cast[id]=(gCast(c)+1)%3;save()}
  else if(a==='loc'){const l=p.locs.find(x=>x.id===id);st.loc[id]=gLoc(l)?0:1;save()}
  else if(a==='prop'){const i=p.props.flatMap(s=>s.items).find(x=>x.id===id);st.prop[id]=gProp(i)?0:1;save()}
  else if(a==='send'){ui.sheet='sending';render();setTimeout(()=>{ui.sheet='sent';st.sent[ui.pid]=1;save();render()},1100);return}
  else if(a==='part'){ui.view='part';ui.asId=(p.crew.find(x=>!gAcc(x))||p.crew[0]).id}
  else if(a==='part2'){ui.sheet=null;ui.view='part';ui.asId=(p.crew.find(x=>!gAcc(x))||p.crew[0]).id}
  else if(a==='partback'){ui.view='project'}
  else if(a==='accept'){st.acc[id]=1;save()}
  else if(a==='noaccept'){st.acc[id]=0;save()}
  render();
});
$app.addEventListener('change',e=>{ if(e.target.dataset.act==='who'){ui.asId=e.target.value;render()} });
render();
</script>
</body>
</html>
